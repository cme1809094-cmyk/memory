<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self';">
  <title>Memory</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="titlebar">
    <div class="title-label"><img src="app.png" width="15" height="15" alt=""> Memory</div>
    <div class="title-center">个人工作区</div>
  </header>
  <div class="workspace" id="workspace">
    <aside class="sidebar" id="sidebar" aria-label="工作区导航"></aside>
    <main class="main">
      <header class="mainbar" id="mainbar"></header>
      <div class="columns" id="columns">
        <section class="listing" id="listing" aria-label="条目列表"></section>
        <article class="detail" id="detail" aria-label="条目详情"></article>
      </div>
    </main>
  </div>
  <dialog id="modal" aria-labelledby="dialog-title"></dialog>
  <div id="status" class="toast" role="status"></div>
</body>
</html>
